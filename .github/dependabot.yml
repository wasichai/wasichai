version: 2

updates:
  # GitHub Actions: actualizaciones fijadas por SHA
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Gradle / gradle/libs.versions.toml
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # npm: commitlint, husky, prettier y otras dependencias
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      tooling:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
