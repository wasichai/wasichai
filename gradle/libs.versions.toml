# Single source of truth for every backend dependency version.
[versions]
kotlin = "2.4.21"
springBoot = "4.2.0"
ktlint = "14.2.0"
ktlintTool = "1.7.1"
postgresqlJdbc = "42.7.14"
flyway = "13.12.2"
testcontainers = "2.0.5"
embabel = "1.5.4"
# wasichai-files' S3-compatible store: optional, an app that uses it adds the s3 artifact itself
awsSdk = "2.59.3"
# security floors over the spring boot bom: boot 4.2.0 still ships vulnerable patch versions. drop each once boot catches up.
jackson2 = "2.23.0"
jackson3 = "3.3.0"
scram = "3.4"
# embabel 1.5.4 brings spring ai 2.0.1: CVE-2026-59338, -59339, -59344 and -59345, fixed in 2.0.3. drop once embabel catches up
springAi = "2.0.3"
# embabel (through jinjava) brings guava 33.3.1: CVE-2026-102554, fixed in 33.7.2
guava = "33.7.2-jre"
# embabel brings opentelemetry 1.62.0: CVE-2026-118259, fixed in 1.67.0
opentelemetry = "1.67.0"
# ktlint's own classpath brings logback 1.3.15; lifted to the boot line
logback = "1.6.6"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# optional: the notifications email channel. an app that wants email adds spring-boot-starter-mail itself
spring-boot-mail = { module = "org.springframework.boot:spring-boot-mail" }

jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3" }
scram-client = { module = "com.ongres.scram:scram-client", version.ref = "scram" }
scram-common = { module = "com.ongres.scram:scram-common", version.ref = "scram" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }
micrometer-context-propagation = { module = "io.micrometer:context-propagation" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }

r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }
postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresqlJdbc" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

embabel-agent-starter = { module = "com.embabel.agent:embabel-agent-starter", version.ref = "embabel" }
embabel-agent-starter-anthropic = { module = "com.embabel.agent:embabel-agent-starter-anthropic", version.ref = "embabel" }

aws-sdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awsSdk" }

reactor-test = { module = "io.projectreactor:reactor-test" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

# build-logic: convention plugins compile against these
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
